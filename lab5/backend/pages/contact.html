```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact - MacBook</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f7;
      color: #1d1d1f;
    }

    /* Navbar */
    nav {
      background-color: rgba(255, 255, 255, 0.9);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 8%;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    nav ul li a {
      text-decoration: none;
      color: #1d1d1f;
      font-size: 15px;
    }

    nav ul li a:hover {
      color: #0071e3;
    }

    /* Contact Section */
    .contact-section {
      min-height: 85vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 60px 20px;
    }

    .contact-container {
      width: 100%;
      max-width: 900px;
      background-color: white;
      padding: 50px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .contact-container h1 {
      text-align: center;
      font-size: 50px;
      margin-bottom: 10px;
    }

    .contact-container > p {
      text-align: center;
      color: #6e6e73;
      font-size: 18px;
      margin-bottom: 40px;
    }

    /* Form */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 16px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      background-color: #fafafa;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #0071e3;
      background-color: white;
    }

    .form-group textarea {
      min-height: 150px;
      resize: vertical;
    }

    .submit-btn {
      border: none;
      background-color: #0071e3;
      color: white;
      padding: 14px 25px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #005bb5;
    }

    /* Contact Information */
    .contact-info {
      display: flex;
      justify-content: center;
      gap: 60px;
      margin-top: 45px;
      padding-top: 30px;
      border-top: 1px solid #d2d2d7;
      text-align: center;
      flex-wrap: wrap;
    }

    .info-box h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .info-box p {
      color: #6e6e73;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 25px;
      background-color: #1d1d1f;
      color: white;
    }

    /* Mobile */
    @media (max-width: 768px) {

      nav ul {
        display: none;
      }

      .contact-container {
        padding: 30px 20px;
      }

      .contact-container h1 {
        font-size: 38px;
      }

      .contact-container > p {
        font-size: 16px;
      }

      .contact-info {
        gap: 30px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="logo"> MacBook</div>

    <ul>
      <li><a href="product.html">MacBook Air</a></li>
      <li><a href="#">MacBook Pro</a></li>
      <li><a href="#">Compare</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Contact Section -->
  <section class="contact-section">

    <div class="contact-container">

      <h1>Contact Us</h1>

      <p>
        Have a question about MacBook? We'd love to hear from you.
      </p>

      <!-- Contact Form -->
      <form class="contact-form">

        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            placeholder="Enter subject"
            required
          />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            placeholder="Write your message..."
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-btn">
          Send Message
        </button>

      </form>

      <!-- Contact Information -->
      <div class="contact-info">

        <div class="info-box">
          <h3>📧 Email</h3>
          <p>support@macbook.com</p>
        </div>

        <div class="info-box">
          <h3>📞 Phone</h3>
          <p>1800-123-4567</p>
        </div>

        <div class="info-box">
          <h3>📍 Location</h3>
          <p>California, USA</p>
        </div>

      </div>

    </div>

  </section>

  <!-- Footer -->
  <footer>
    <p>Copyright © 2026 MacBook. All rights reserved.</p>
  </footer>

</body>
</html>
```
